<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyMentor - Smart Financial Management</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="theme-toggle">
        <button id="themeToggle" class="btn btn--outline">
            <i class="fas fa-moon"></i>
        </button>
    </div>
    <header class="header">
        <div class="container">
            <div class="header__content">
                <h1 class="header__title">
                    <i class="fas fa-chart-line"></i>
                    MoneyMentor
                </h1>
                <div class="role-selector">
                    <button id="studentRole" class="role-btn active">
                        <i class="fas fa-graduation-cap"></i>
                        Student
                    </button>
                    <button id="professionalRole" class="role-btn">
                        <i class="fas fa-briefcase"></i>
                        Professional
                    </button>
                </div>
            </div>
        </div>
    </header>
    <nav class="nav">
        <div class="container">
            <div class="nav__content">
                <button class="nav__item active" data-tab="dashboard">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </button>
                <button class="nav__item" data-tab="transactions">
                    <i class="fas fa-exchange-alt"></i>
                    <span>Transactions</span>
                </button>
                <button class="nav__item" data-tab="budget">
                    <i class="fas fa-calculator"></i>
                    <span>Budget</span>
                </button>
                <button class="nav__item" data-tab="subscriptions">
                    <i class="fas fa-sync"></i>
                    <span>Subscriptions</span>
                </button>
                <button class="nav__item" data-tab="investments">
                    <i class="fas fa-chart-pie"></i>
                    <span>Investments</span>
                </button>
                <button class="nav__item" data-tab="reports">
                    <i class="fas fa-chart-bar"></i>
                    <span>Reports</span>
                </button>
                <button class="nav__item" data-tab="ai-chat">
                    <i class="fas fa-robot"></i>
                    <span>AI Assistant</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="main">
        <div class="container">
            <div id="dashboard" class="tab-content active"></div>
            <div id="transactions" class="tab-content"></div>
            <div id="budget" class="tab-content"></div>
            <div id="subscriptions" class="tab-content"></div>
            <div id="investments" class="tab-content"></div>
            <div id="reports" class="tab-content"></div>
            <div id="ai-chat" class="tab-content"></div>
        </div>
    </main>
    <div id="subscriptionModal" class="modal hidden">
        <div class="modal__overlay"></div>
        <div class="modal__content">
            <div class="modal__header">
                <h3>Add Subscription</h3>
                <button class="modal__close">&times;</button>
            </div>
            <form id="subscriptionForm">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="subscriptionName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Cost (₹)</label>
                    <input type="number" id="subscriptionCost" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Renewal Date</label>
                    <input type="date" id="subscriptionRenewalDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="subscriptionCategory" class="form-control" required>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Music">Music</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Software">Software</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="modal__actions">
                    <button type="button" class="btn btn--outline" id="cancelSubscription">Cancel</button>
                    <button type="submit" class="btn btn--primary">Add Subscription</button>
                </div>
            </form>
        </div>
    </div>
    <div id="budgetModal" class="modal hidden">
        <div class="modal__overlay"></div>
        <div class="modal__content">
            <div class="modal__header">
                <h3>Add Budget</h3>
                <button class="modal__close">&times;</button>
            </div>
            <form id="budgetForm">
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <input type="text" id="budgetName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Limit (₹)</label>
                    <input type="number" id="budgetLimit" class="form-control" required>
                </div>
                <div class="modal__actions">
                    <button type="button" class="btn btn--outline" id="cancelBudget">Cancel</button>
                    <button type="submit" class="btn btn--primary">Add Budget</button>
                </div>
            </form>
        </div>
    </div>
    <div id="notifications" class="notifications"></div>
    <script src="app.js"></script>
</body>
</html>
